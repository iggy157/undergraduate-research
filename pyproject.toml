[project]
name = "ugr"
version = "0.1.0"
description = "Single-agent vs multi-agent discussion generation over three domains (aiwolf / candidate_selection / shared_living)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "jinja2>=3.1.6",
    "websockets>=13.0",
    "websocket-client>=1.8.0",
    "openai>=1.50.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common", "server", "agent", "single"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
